<?xml version="1.0" encoding="iso-8859-1"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" x="0px" y="0px"
	 viewBox="-44 -44 600 600" style="enable-background:new 0 0 512 512;" xml:space="preserve">

<defs>
	<clipPath id="circle-clip">
		<circle cx="256" cy="256" r="256"/>
	</clipPath>
	<!-- Large Subtle Brick Wall Pattern (4:1 Ratio, Uniform Thin Mortar) -->
	<pattern id="brick" width="240" height="120" patternUnits="userSpaceOnUse">
		<!-- Mortar Background -->
		<rect width="240" height="120" fill="#5C0000"/>
		<!-- Row 1 Bricks (Full brick) -->
		<rect x="0" y="0" width="234" height="54" fill="#8E0000"/>
		<!-- Row 2 Bricks (Offset by half) -->
		<rect x="-120" y="60" width="234" height="54" fill="#8E0000"/>
		<rect x="120" y="60" width="234" height="54" fill="#8E0000"/>
	</pattern>
	
	<!-- Shadow ONLY Filter (No SourceGraphic merge, outputs only the flat drop shadow) -->
	<filter id="shadow-only" x="-20%" y="-20%" width="140%" height="140%">
		<feGaussianBlur in="SourceAlpha" stdDeviation="0"/>
		<feOffset dx="24" dy="32" result="offsetblur"/>
		<feComponentTransfer>
			<feFuncA type="linear" slope="0.6"/>
		</feComponentTransfer>
	</filter>

	<!-- The complete weapon definition -->
	<g id="weapon">
		<!-- GROUP 1: CLIPPED (Barrel, Handle, Chain stay inside the unscaled background circle) -->
		<g clip-path="url(#circle-clip)">
			<g transform="translate(256 256) scale(1.05) translate(-256 -256)">
				<g transform="rotate(45 256 256)">
					
					<!-- DARK OUTLINES (Reduced to 4px borders) -->
					<!-- ORIGINAL CHAIN STYLING (Restored) -->
					<g stroke-linejoin="round">
						<rect x="241" y="116" width="30" height="50" rx="15" fill="none" stroke="#37474F" stroke-width="12" />
						<rect x="241" y="116" width="30" height="50" rx="15" fill="none" stroke="#B0BEC5" stroke-width="6" />
						<rect x="241" y="178" width="30" height="50" rx="15" fill="none" stroke="#37474F" stroke-width="12" />
						<rect x="241" y="178" width="30" height="50" rx="15" fill="none" stroke="#B0BEC5" stroke-width="6" />
						<rect x="241" y="240" width="30" height="50" rx="15" fill="none" stroke="#37474F" stroke-width="12" />
						<rect x="241" y="240" width="30" height="50" rx="15" fill="none" stroke="#B0BEC5" stroke-width="6" />

						<rect x="248" y="70" width="16" height="71" rx="8" fill="#37474F" />
						<rect x="252" y="74" width="8" height="63" rx="4" fill="#B0BEC5" />
						<rect x="248" y="141" width="16" height="62" rx="8" fill="#37474F" />
						<rect x="252" y="145" width="8" height="54" rx="4" fill="#B0BEC5" />
						<rect x="248" y="203" width="16" height="62" rx="8" fill="#37474F" />
						<rect x="252" y="207" width="8" height="54" rx="4" fill="#B0BEC5" />
						<rect x="248" y="265" width="16" height="35" rx="8" fill="#37474F" />
						<rect x="252" y="269" width="8" height="27" rx="4" fill="#B0BEC5" />
					</g>
					
					<!-- Barrel & Caps Dark -->
					<g fill="#37474F" stroke="#37474F" stroke-width="8" stroke-linejoin="round">
						<rect x="229" y="330" width="54" height="140" />
						<rect x="214" y="298" width="84" height="24" rx="6" />
						<rect x="224" y="478" width="64" height="64" rx="6" />
					</g>

					<!-- Barrel & Caps Light -->
					<rect x="229" y="330" width="54" height="140" fill="#90A4AE" />
					<rect x="237" y="330" width="22" height="140" fill="#CFD8DC" />
					<rect x="214" y="298" width="84" height="24" rx="6" fill="#78909C" />
					<rect x="224" y="478" width="64" height="64" rx="6" fill="#78909C" />
				</g>
			</g>
		</g>

		<!-- GROUP 2: UNCLIPPED (Hooks, Spike, Barbs bleed outside) -->
		<g transform="translate(256 256) scale(1.05) translate(-256 -256)">
			<g transform="rotate(45 256 256)">
				<!-- DARK OUTLINES -->
				<line x1="256" y1="60" x2="256" y2="-55" stroke="#37474F" stroke-width="24" stroke-linecap="round"/>
				<polygon points="248,-50 256,-85 264,-50" fill="#37474F" stroke="#37474F" stroke-width="8" stroke-linejoin="round"/>
				<path d="M 238 55 C 238 -50, 135 -70, 135 45" fill="none" stroke="#37474F" stroke-width="24" stroke-linecap="round"/>
				<polygon points="124,34 124,48 135,72 153,50 146,44 146,34" fill="#37474F" stroke="#37474F" stroke-width="8" stroke-linejoin="round"/>
				<path d="M 274 55 C 274 -50, 377 -70, 377 45" fill="none" stroke="#37474F" stroke-width="24" stroke-linecap="round"/>
				<polygon points="388,34 388,48 377,72 359,50 366,44 366,34" fill="#37474F" stroke="#37474F" stroke-width="8" stroke-linejoin="round"/>

				<!-- SILVER FILLS -->
				<line x1="256" y1="60" x2="256" y2="-55" stroke="#CFD8DC" stroke-width="16" stroke-linecap="round"/>
				<line x1="256" y1="60" x2="256" y2="-55" stroke="#ECEFF1" stroke-width="6" stroke-linecap="round"/>
				<polygon points="248,-50 256,-85 264,-50" fill="#CFD8DC" />
				<path d="M 238 55 C 238 -50, 135 -70, 135 45" fill="none" stroke="#CFD8DC" stroke-width="16" stroke-linecap="round"/>
				<path d="M 238 55 C 238 -50, 135 -70, 135 45" fill="none" stroke="#ECEFF1" stroke-width="6" stroke-linecap="round"/>
				<polygon points="124,34 124,48 135,72 153,50 146,44 146,34" fill="#CFD8DC" />
				<polygon points="127,36 127,46 135,66 148,48 143,46 143,36" fill="#ECEFF1" />
				<path d="M 274 55 C 274 -50, 377 -70, 377 45" fill="none" stroke="#CFD8DC" stroke-width="16" stroke-linecap="round"/>
				<path d="M 274 55 C 274 -50, 377 -70, 377 45" fill="none" stroke="#ECEFF1" stroke-width="6" stroke-linecap="round"/>
				<polygon points="388,34 388,48 377,72 359,50 366,44 366,34" fill="#CFD8DC" />
				<polygon points="385,36 385,46 377,66 364,48 369,46 369,36" fill="#ECEFF1" />
			</g>
		</g>

		<!-- GROUP 3: UNCLIPPED COLLAR (Sits on top of both Hooks and Barrel) -->
		<g transform="translate(256 256) scale(1.05) translate(-256 -256)">
			<g transform="rotate(45 256 256)">
				<rect x="234" y="76" width="44" height="18" rx="9" fill="#37474F" stroke="#37474F" stroke-width="8" stroke-linejoin="round" />
				<rect x="234" y="76" width="44" height="18" rx="9" fill="#78909C" />
			</g>
		</g>
	</g>
</defs>

<!-- Background circle with brick pattern -->
<circle cx="256" cy="256" r="256" fill="url(#brick)"/>

<!-- Shadow Layer (Clipped strictly inside the circle) -->
<g clip-path="url(#circle-clip)">
	<use xlink:href="#weapon" filter="url(#shadow-only)" />
</g>

<!-- Weapon Layer (Allows unclipped parts to bleed outside) -->
<use xlink:href="#weapon" />

</svg>
