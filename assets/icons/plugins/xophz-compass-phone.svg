<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" id="Xophz_Compass_Phone_Icon" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="512pt" height="512pt" viewBox="-44 -44 600 600" style="enable-background:new 0 0 512 512;" xml:space="preserve">
  <!-- 1. Background Medallion Base Circles (Full r=256 canvas match) -->
  <path d="M 512,256 C 512,397.385 397.385,512 256,512 C 114.615,512 0,397.385 0,256 C 0,114.615 114.615,0 256,0 C 397.385,0 512,114.615 512,256 Z" fill="#38BDF8"/>
  <circle cx="256" cy="256" r="238" fill="#0284C7"/>
  <circle cx="256" cy="256" r="216" fill="#0369A1"/>
  <circle cx="256" cy="256" r="195" fill="#0F172A"/>
  <circle cx="256" cy="256" r="180" fill="#1E293B"/>

  <!-- Decorative Inner Ring -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="#38BDF8" stroke-width="4" stroke-dasharray="12 8" opacity="0.6"/>

  <!-- 2. Main Phone Object (POPPING OUT OF TOP y=-16, EXTENDING DOWN TO y=454) -->
  <g transform="translate(0, 0)">
    <!-- Shadow behind phone body -->
    <rect x="142" y="-8" width="228" height="462" rx="34" fill="#0284C7" opacity="0.35"/>
    
    <!-- Phone Bezel & Outer Shell (Pops out of top of circle at y=-16) -->
    <rect x="136" y="-16" width="240" height="470" rx="34" fill="#0F172A" stroke="#38BDF8" stroke-width="7"/>

    <!-- Screen Glass Area -->
    <rect x="150" y="10" width="212" height="418" rx="24" fill="#0B132B"/>
    
    <!-- Screen Inner Dark Gradient Backdrop -->
    <rect x="154" y="14" width="204" height="410" rx="20" fill="#111B33"/>

    <!-- Top Speaker Notch (High above top circle rim) -->
    <rect x="220" y="-4" width="72" height="8" rx="4" fill="#334155"/>
    <circle cx="306" cy="0" r="4" fill="#38BDF8"/>

    <!-- Screen Content: Glowing COMPASS Emblem -->
    <!-- Grid/Radar Accent Rings on Screen -->
    <circle cx="256" cy="216" r="85" fill="none" stroke="#0284C7" stroke-width="2.5" opacity="0.4" stroke-dasharray="8 5"/>
    <circle cx="256" cy="216" r="55" fill="none" stroke="#38BDF8" stroke-width="2.5" opacity="0.6"/>

    <!-- COMPASS Star (Cyan / Neon Blue) -->
    <!-- North Arrow -->
    <path d="M 256,140 L 270,200 L 256,216 Z" fill="#38BDF8"/>
    <path d="M 256,140 L 242,200 L 256,216 Z" fill="#00F2FE"/>
    <!-- South Arrow -->
    <path d="M 256,292 L 242,232 L 256,216 Z" fill="#0284C7"/>
    <path d="M 256,292 L 270,232 L 256,216 Z" fill="#0369A1"/>
    <!-- East Arrow -->
    <path d="M 332,216 L 270,232 L 256,216 Z" fill="#38BDF8"/>
    <path d="M 332,216 L 270,200 L 256,216 Z" fill="#00F2FE"/>
    <!-- West Arrow -->
    <path d="M 180,216 L 242,200 L 256,216 Z" fill="#0284C7"/>
    <path d="M 180,216 L 242,232 L 256,216 Z" fill="#0369A1"/>

    <!-- Center Gem Node -->
    <circle cx="256" cy="216" r="10" fill="#E0F2FE"/>
    <circle cx="256" cy="216" r="5" fill="#FFFFFF"/>

    <!-- Bottom Home Indicator Bar -->
    <rect x="216" y="402" width="80" height="5" rx="2.5" fill="#38BDF8" opacity="0.8"/>

    <!-- Glass Surface Reflection / Flare -->
    <path d="M 154,14 L 330,14 L 154,190 Z" fill="#FFFFFF" opacity="0.08"/>

    <!-- Outer Orbital Sparkles (Popping Out Above & Beside Circle) -->
    <path d="M 420,30 L 426,45 L 441,51 L 426,57 L 420,72 L 414,57 L 399,51 L 414,45 Z" fill="#38BDF8"/>
    <path d="M 90,50 L 95,61 L 106,66 L 95,71 L 90,82 L 85,71 L 74,66 L 85,61 Z" fill="#00F2FE"/>
  </g>

  <!-- 3. Foreground Bottom Circle Arc (Tucking bottom behind circle base) -->
  <path d="M 0,256 C 0,397.385 114.615,512 256,512 C 397.385,512 512,397.385 512,256 L 472,256 C 472,375.295 375.295,472 256,472 C 136.705,472 40,375.295 40,256 Z" fill="#38BDF8"/>
  <path d="M 18,256 C 18,387.442 124.558,494 256,494 C 387.442,494 494,387.442 494,256 L 472,256 C 472,375.295 375.295,472 256,472 C 136.705,472 40,375.295 40,256 Z" fill="#0284C7"/>
  <path d="M 40,256 C 40,375.295 136.705,472 256,472 C 375.295,472 472,375.295 472,256 L 451,256 C 451,358.724 363.724,446 256,446 C 148.276,446 61,358.724 61,256 Z" fill="#0369A1"/>
  <path d="M 61,256 C 61,358.724 148.276,446 256,446 C 363.724,446 451,358.724 451,256 L 436,256 C 436,350.441 355.441,431 256,431 C 156.559,431 76,350.441 76,256 Z" fill="#0F172A"/>

  <!-- Decorative Inner Ring Bottom Arc -->
  <path d="M 88,256 C 88,348.784 163.216,424 256,424 C 348.784,424 424,348.784 424,256" fill="none" stroke="#38BDF8" stroke-width="4" stroke-dasharray="12 8" opacity="0.6"/>
</svg>
